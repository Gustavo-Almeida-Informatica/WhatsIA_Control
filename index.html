    <script>
      // Filter out transient WebSocket closure rejections to prevent white screen crashes
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.description || String(reason))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
          event.preventDefault();
          console.warn('[System] Ignorando rejeição transitória de WebSocket:', msg);
        }
      });
      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || '')) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
          event.preventDefault();
        }
      });
    </script>
  </head>
